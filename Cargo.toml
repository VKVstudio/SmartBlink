[package]
name = "smartblink"
version = "0.1.0-beta"
description = "Privacy-first Windows 10/11 tray utility that detects wrong keyboard layout typing with LED + audio alerts and fixes words on a single manual gesture (no auto-replace)."
authors = ["VKV Studio <https://vkvstudio.com>"]
license = "MIT"
edition = "2021"
rust-version = "1.75"
readme = "README.md"
homepage = "https://vkvstudio.com"
repository = "https://github.com/vkvstudio/SmartBlink"
keywords = ["windows", "keyboard", "layout-switcher", "input-utility", "tray-utility"]
categories = ["os::windows-apis", "command-line-utilities", "internationalization"]
build = "build.rs"

[[bin]]
name = "smartblink"
path = "src/main.rs"

[dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_DataExchange",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Com",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_Ime",
    "Win32_UI_Shell",
    "Win32_UI_Accessibility",
    "Win32_Media_Audio",
] }

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
codegen-units = 1
