name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64 (LLVM-MinGW gnullvm)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install LLVM-MinGW (UCRT x86_64)
        shell: pwsh
        run: |
          $url = "https://github.com/mstorsjo/llvm-mingw/releases/download/20240619/llvm-mingw-20240619-ucrt-x86_64.zip"
          Invoke-WebRequest -Uri $url -OutFile "$env:TEMP\llvm-mingw.zip"
          Expand-Archive -Path "$env:TEMP\llvm-mingw.zip" -DestinationPath "C:\llvm-mingw"
          $binDir = (Get-ChildItem "C:\llvm-mingw\*\bin" | Select-Object -First 1).FullName
          echo "$binDir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "SMARTBLINK_WINDRES=$binDir\x86_64-w64-mingw32-windres.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "CARGO_TARGET_X86_64_PC_WINDOWS_GNULLVM_LINKER=$binDir\x86_64-w64-mingw32-clang.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Rust x86_64-pc-windows-gnullvm
        shell: pwsh
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnullvm --profile minimal
          rustup default stable-x86_64-pc-windows-gnullvm

      - name: Run unit tests
        shell: pwsh
        run: cargo test --release --target x86_64-pc-windows-gnullvm

      - name: Build release binary
        shell: pwsh
        run: cargo build --release --target x86_64-pc-windows-gnullvm

      - name: Build Inno Setup 6 installer
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches.Groups[1].Value
          $iscc = if (Get-Command iscc -ErrorAction SilentlyContinue) { "iscc" } else { "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DMyAppVersion=$version" installer\SmartBlink.iss

      - name: Generate SHA256SUMS.txt
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target\x86_64-pc-windows-gnullvm\release\smartblink.exe" "dist\smartblink.exe"
          Copy-Item "target\installer\SmartBlink-Setup-*.exe" "dist\"
          Push-Location dist
          $lines = Get-ChildItem -File | ForEach-Object {
            $hash = (Get-FileHash $_.Name -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          }
          $lines | Set-Content -Path "SHA256SUMS.txt" -Encoding ascii
          Get-Content "SHA256SUMS.txt"
          Pop-Location

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SmartBlink-Windows-x64
          path: dist/*

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
